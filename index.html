<!DOCTYPE html>
<html lang="en" style="background-color: #1D2743;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/prime-icon-dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D2743" />
    <title>PRIME WOODEN WORK | Wood Arthouse — Cairo, Egypt</title>
    <!-- Google Fonts for Editorial Luxury Aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Ensure zero white flash on first-time cold visits */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #1D2743;
      }
      @keyframes primePulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes primeBar {
        0% { width: 10%; }
        50% { width: 60%; }
        100% { width: 95%; }
      }
      .initial-splash-logo {
        animation: primePulse 2.5s ease-in-out infinite;
      }
      .initial-splash-bar {
        animation: primeBar 2.2s ease-out forwards;
      }
    </style>
  </head>
  <body style="margin: 0; background-color: #1D2743;" class="text-charcoal-800 font-sans antialiased selection:bg-wood-200 selection:text-wood-900 overflow-x-hidden">
    <div id="root">
      <!-- Instant First-Time Visitor Splash Screen -->
      <div id="initial-splash" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #1D2743; user-select: none;">
        <div style="text-align: center; max-width: 28rem; width: 100%; padding: 0 1.5rem;">
          <div class="initial-splash-logo" style="margin-bottom: 1.5rem;">
            <img src="/images/prime-logo-light.png" alt="PRIME Wood Arthouse" style="height: 4.5rem; width: auto; object-fit: contain; margin: 0 auto; display: block;" />
          </div>
          <div style="color: rgba(241, 231, 204, 0.85); font-size: 0.8rem; letter-spacing: 0.3em; text-transform: uppercase; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 300; margin-bottom: 2rem;">
            WOOD ARTHOUSE &bull; EST. 1948
          </div>
          <div style="width: 14rem; height: 1.5px; background: rgba(241, 231, 204, 0.2); border-radius: 9999px; margin: 0 auto; overflow: hidden;">
            <div class="initial-splash-bar" style="height: 100%; background: #F1E7CC; border-radius: 9999px;"></div>
          </div>
          <div style="margin-top: 1rem; font-size: 0.7rem; letter-spacing: 0.2em; color: rgba(216, 210, 194, 0.5); text-transform: uppercase; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
            Cairo, Egypt
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
